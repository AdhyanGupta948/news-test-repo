<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgCoins" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="gSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bgCoins)"/>
  
  <!-- ₹1 Central Coin -->
  <circle cx="400" cy="220" r="135" fill="url(#gGold)" stroke="#fef08a" stroke-width="8"/>
  <circle cx="400" cy="220" r="112" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="8,8"/>
  <text x="400" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="96" font-weight="900" fill="#78350f" text-anchor="middle">₹1</text>
  <text x="400" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle" letter-spacing="4">INDIA • 1985</text>
  
  <!-- ₹2 Silver Coin -->
  <circle cx="210" cy="250" r="90" fill="url(#gSilver)" stroke="#f1f5f9" stroke-width="6"/>
  <circle cx="210" cy="250" r="75" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="210" y="275" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="60" font-weight="900" fill="#334155" text-anchor="middle">₹2</text>
  
  <!-- ₹5 Gold Coin -->
  <circle cx="590" cy="250" r="90" fill="url(#gGold)" stroke="#fef08a" stroke-width="6"/>
  <circle cx="590" cy="250" r="75" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="590" y="275" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="60" font-weight="900" fill="#78350f" text-anchor="middle">₹5</text>
  
  <rect x="180" y="390" width="440" height="42" rx="21" fill="#f59e0b" opacity="0.25"/>
  <text x="400" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="2">RARE INDIAN COIN MARKET BOOM</text>
</svg>

